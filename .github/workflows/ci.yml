name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Eval gate (fails the build below 90% on any field)
        run: python -m evals --report eval-report.json
      - name: Mutation check (each protection must have a failing test)
        run: python scripts/mutation_check.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.13'
        with:
          name: eval-report
          path: eval-report.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t intakeguard .
      - name: Container smoke test
        run: |
          docker run -d --name ig -p 8000:8000 intakeguard
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/healthz
